<!doctype html>
<html lang="en" data-lavish-annotate="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>node-assets CLI: proposed contract after Alex's comments</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
  --cp-card-shadow: 0 0 2px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.14);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--cp-bg); color: var(--cp-text); }
body {
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
code, pre, kbd, .mono { font-family: Consolas, "Courier New", Courier, monospace; }
code { font-size: 0.92em; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 6px; padding: 0 4px; overflow-wrap: anywhere; }
a { color: var(--cp-link); }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
h3 { font-size: 16px; margin-bottom: 6px; }
p { margin: 8px 0; }
ul, ol { margin: 8px 0; padding-left: 22px; }
li { margin: 3px 0; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; max-width: 1240px; margin: 0 auto; padding: 24px 20px 64px; }
@media (min-width: 1100px) { .layout { grid-template-columns: 200px minmax(0, 1fr); } }
nav.toc { display: none; }
@media (min-width: 1100px) {
  nav.toc { display: block; position: sticky; top: 20px; align-self: start; font-size: 13.5px; }
  nav.toc a { display: block; padding: 4px 10px; border-radius: 10px; color: var(--cp-text-muted); text-decoration: none; }
  nav.toc a:hover { background: var(--cp-accent-soft); color: var(--cp-text); }
  nav.toc .toc-title { font-weight: 600; color: var(--cp-text); padding: 4px 10px 8px; }
}
main { min-width: 0; display: grid; gap: 20px; }

.card { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; box-shadow: var(--cp-card-shadow); padding: 20px 22px; min-width: 0; }
.soft { background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.section-head p { margin: 4px 0 0; color: var(--cp-text-muted); }
.section-head > div { min-width: 0; flex: 1 1 320px; }
.eyebrow { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cp-accent); font-weight: 600; }
.muted { color: var(--cp-text-muted); }
.small { font-size: 13px; }

.hero h1 { margin: 6px 0 10px; }
.hero .question { font-size: 17px; color: var(--cp-text-muted); margin: 0 0 6px; }
.hero .answer { font-size: 18px; margin: 0 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--cp-border); background: var(--cp-bg-elevated); color: var(--cp-text-muted); white-space: nowrap; }
.chip.accent { border-color: var(--cp-accent); color: var(--cp-accent); background: var(--cp-accent-soft); }

.btn { font: inherit; font-size: 13.5px; border-radius: 10px; border: 1px solid var(--cp-border-strong); background: var(--cp-surface); color: var(--cp-text); padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--cp-accent); color: var(--cp-accent); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .mod:focus-visible, .steps button:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 1px; }
.btn.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
.btn.primary:hover { background: var(--cp-accent-hover); color: var(--cp-accent-fg); }
.btn.suggest::before { content: "✎ "; }
.btn.small { font-size: 12.5px; padding: 3px 9px; }
.btn[aria-pressed="true"] { background: var(--cp-accent-soft); border-color: var(--cp-accent); color: var(--cp-accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 10px; }
.howto .soft b { display: block; margin-bottom: 2px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
dl.glossary { display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr); gap: 6px 14px; margin: 10px 0 0; }
dl.glossary dt { font-weight: 600; }
dl.glossary dd { margin: 0; color: var(--cp-text-muted); }
@media (max-width: 560px) { dl.glossary { grid-template-columns: minmax(0, 1fr); } dl.glossary dd { margin-bottom: 6px; } }

.table-wrap { overflow-x: auto; border: 1px solid var(--cp-border); border-radius: 10px; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--cp-border); }
th { background: var(--cp-surface-soft); font-weight: 600; font-size: 13px; color: var(--cp-text-muted); white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td code { white-space: nowrap; }
td.wrap code { white-space: normal; }

svg.diagram { width: 100%; height: auto; display: block; margin: 8px 0; }
svg.diagram text { fill: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; }
svg.diagram text.sub { fill: var(--cp-text-muted); font-size: 12px; }
svg.diagram text.note { fill: var(--cp-text-muted); font-size: 12.5px; }
svg.diagram text.edge-label { fill: var(--cp-text-muted); font-size: 12px; }
svg.diagram text.mono-sm { fill: var(--cp-text-muted); font-family: Consolas, "Courier New", Courier, monospace; font-size: 12px; }
svg.diagram .node rect { fill: var(--cp-surface); stroke: var(--cp-border-strong); stroke-width: 1.2; }
svg.diagram .node.accent rect { fill: var(--cp-accent-soft); stroke: var(--cp-accent); }
svg.diagram .edge { fill: none; stroke: var(--cp-text-muted); stroke-width: 1.5; }
svg.diagram .arrowhead { fill: var(--cp-text-muted); }

pre.term { margin: 8px 0 0; padding: 12px 14px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 10px; font-size: 12.5px; line-height: 1.5; overflow-x: auto; white-space: pre; color: var(--cp-text); }
pre.term .stderr { color: var(--cp-text-soft); font-style: italic; }
pre.term .cmd { color: var(--cp-accent); }
.label-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }

.builder { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 10px; }
@media (min-width: 900px) { .builder { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
.fields { display: grid; gap: 10px; align-content: start; }
.field { display: grid; gap: 3px; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--cp-text-muted); }
.field input[type="text"], .field select, dialog input[type="text"], dialog select, dialog textarea, .calc input, .calc select, .filter input {
  font: inherit; font-size: 14px; width: 100%; padding: 6px 9px; border-radius: 10px; border: 1px solid var(--cp-border-strong); background: var(--cp-bg-elevated); color: var(--cp-text); min-width: 0;
}
.checks { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.result { display: grid; gap: 10px; align-content: start; min-width: 0; }
.cmdline { display: flex; gap: 8px; align-items: stretch; }
.cmdline pre { flex: 1 1 auto; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.status.ok { color: var(--cp-success); }
.status.err { color: var(--cp-danger); }

.formula { font-family: Consolas, "Courier New", Courier, monospace; font-size: 12.5px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 10px; padding: 6px 8px; margin: 6px 0; overflow-wrap: anywhere; }
.calc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 12px; }
@media (min-width: 900px) { .calc { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.calc-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-content: start; }
.calc-out .big { font-size: 26px; font-weight: 600; }
.calc-out td.num, .calc-out th.num { text-align: right; }

.stepper { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 10px; }
@media (min-width: 900px) { .stepper { grid-template-columns: minmax(0, 260px) minmax(0, 1fr); } }
.steps { display: grid; gap: 4px; align-content: start; }
.steps button { text-align: left; font: inherit; font-size: 13.5px; border: 1px solid transparent; background: transparent; color: var(--cp-text-muted); border-radius: 10px; padding: 5px 10px; cursor: pointer; }
.steps button:hover { background: var(--cp-accent-soft); color: var(--cp-text); }
.steps button[aria-current="step"] { border-color: var(--cp-accent); color: var(--cp-text); background: var(--cp-accent-soft); }
.steps button .n { display: inline-block; width: 24px; color: var(--cp-accent); font-weight: 600; }
.steps button.na { opacity: 0.55; }
.steps button.na::after { content: " · skipped"; font-size: 12px; }
.step-detail h3 { font-size: 18px; }
.goal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
.goal-grid .soft b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--cp-accent); }

.ladder { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.ladder li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; margin: 0; }
.ladder .rung { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--cp-accent); color: var(--cp-accent); display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--cp-accent-soft); }
.ladder .rung.end { border-color: var(--cp-danger); color: var(--cp-danger); background: transparent; }

.layers { display: grid; gap: 6px; margin-top: 10px; }
.layer { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; border: 1px solid var(--cp-border); border-radius: 10px; padding: 10px 12px; background: var(--cp-bg-elevated); }
@media (min-width: 760px) { .layer { grid-template-columns: 150px minmax(0, 1fr); } }
.layer .lname { font-weight: 600; }
.layer .lname span { display: block; font-weight: 400; font-size: 12.5px; color: var(--cp-text-muted); }
.mods { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.mod { font: inherit; text-align: left; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface); color: var(--cp-text); padding: 6px 10px; cursor: pointer; max-width: 100%; min-width: 0; }
.mod:hover { border-color: var(--cp-accent); }
.mod b { font-family: Consolas, "Courier New", Courier, monospace; font-size: 13px; font-weight: 600; }
.mod .lines { font-size: 12px; color: var(--cp-text-muted); margin-left: 6px; }
.mod .role { display: block; font-size: 12.5px; color: var(--cp-text-muted); }
.layer-arrow { text-align: center; color: var(--cp-text-muted); font-size: 13px; }

.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--cp-border); white-space: nowrap; }
.tag.verified { color: var(--cp-success); border-color: var(--cp-success); }
.tag.older { color: var(--cp-text); border-color: var(--cp-warning); }
.tag.historical, .tag.provisional { color: var(--cp-text-muted); border-color: var(--cp-border-strong); }
.tag.inferred { color: var(--cp-accent); border-color: var(--cp-accent); }

figure { margin: 10px 0 0; }
figure img { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--cp-border); display: block; }
figcaption { font-size: 13px; color: var(--cp-text-muted); margin-top: 6px; }

dialog { border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); color: var(--cp-text); box-shadow: var(--cp-shadow); padding: 0; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: var(--cp-overlay); }
dialog form { display: grid; gap: 12px; padding: 20px 22px; }
dialog textarea { min-height: 110px; resize: vertical; }
dialog .files { font-size: 12.5px; color: var(--cp-text-muted); overflow-wrap: anywhere; }
.queue-bar { position: sticky; bottom: 12px; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; background: var(--cp-panel-strong); border: 1px solid var(--cp-border); border-radius: 16px; box-shadow: var(--cp-shadow); padding: 10px 14px; font-size: 13.5px; }
.queue-bar > div { min-width: 0; }
.queue-bar ol { margin: 4px 0 0; padding-left: 20px; font-size: 13px; color: var(--cp-text-muted); }
.toast { min-height: 20px; font-size: 13px; color: var(--cp-text-muted); }
.filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.filter input { max-width: 320px; }
.hidden { display: none !important; }
</style>
</head>
